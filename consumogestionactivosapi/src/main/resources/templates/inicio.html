<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla/plantillaui}">
<head>
<title>Inicio - AMC Ecuador</title>
</head>
<body>
	<section layout:fragment="contenidopaginas">
		<div class="container-fluid">
			<div class="row">
				<div class="col-lg-12">
					<div class="card stretch stretch-full">
						<div class="card-body">
							<div class="text-center py-5">
								<img th:src="@{/assets/images/logo-AMC-Oficial.png}"
									alt="AMC Logo" style="max-width: 200px; margin-bottom: 20px;">
								<h2 class="mb-3">Sistema de Gestión de Activos</h2>
								<h4 class="text-muted mb-4" th:text="'Bienvenido, ' + ${sesionUsuario.nombreUsuario}">Bienvenido</h4>
								<p class="lead mb-4">
									<span class="badge bg-primary" th:text="${sesionUsuario.rol}">ROL</span>
								</p>
								<p class="text-muted">
									Use el menú lateral para navegar por los módulos disponibles según su rol.
								</p>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
