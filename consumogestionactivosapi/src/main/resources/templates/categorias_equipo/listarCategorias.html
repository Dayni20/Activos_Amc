<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultra.net.nz/thymeleaf/layout"
    layout:decorate="~{plantilla/plantillaui}">

<head>

<title>Categorías Equipo</title>

</head>

<body>
    <div layout:fragment="contenidopaginas">
        <div class="page-header">
            <div class="page-header-left d-flex align-items-center">
                <div class="page-header-title">
                    <h5 class="m-b-10">Categorías Equipo</h5>
                </div>
                <ul class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/categorias-equipo}">Home</a></li>
                    <li class="breadcrumb-item">Categorías</li>
                </ul>
            </div>
            <div class="page-header-right ms-auto">
                <div class="page-header-right-items">
                    <div
                        class="d-flex align-items-center gap-2 page-header-right-items-wrapper">
                        <div class="dropdown">
                            <a class="btn btn-icon btn-light-brand" data-bs-toggle="dropdown"
                                data-bs-offset="0, 12" data-bs-auto-close="outside"> <i
                                class="feather-paperclip"></i>
                            </a>
                            <div class="dropdown-menu dropdown-menu-end">
                                <a href="javascript:void(0);" class="dropdown-item"> <i
                                    class="bi bi-filetype-pdf me-3"></i> <span>PDF</span>
                                </a> <a href="javascript:void(0);" class="dropdown-item"> <i
                                    class="bi bi-filetype-exe me-3"></i> <span>Excel</span>
                                </a>
                            </div>
                        </div>
                        <a th:href="@{/categorias-equipo/nueva-categoria}" class="btn btn-primary"> <i class="feather-plus me-2"></i> <span>Nueva
                                Categoría</span>
                        </a>
                    </div>
                </div>
                <div class="d-md-none d-flex align-items-center">
                    <a href="javascript:void(0)" class="page-header-right-open-toggle">
                        <i class="feather-align-right fs-20"></i>
                    </a>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="card stretch stretch-full">
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover" id="proposalList">
                                    <thead>
                                        <tr>
                                            <th class="wd-30">
                                                <div class="btn-group mb-1">
                                                    <div class="custom-control custom-checkbox ms-1">
                                                        <input type="checkbox" class="custom-control-input"
                                                            id="checkAllProposal"> <label
                                                            class="custom-control-label" for="checkAllProposal"></label>
                                                    </div>
                                                </div>
                                            </th>
                                            <th>Id</th>
                                            <th>Nombre</th>
                                            <th>Descripción</th>
                                            <th>Estado</th>
                                            <th class="text-end">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr class="single-item" th:each="categoria : ${listarcategorias}">
                                            <td>
                                                <div class="item-checkbox ms-1">
                                                    <div class="custom-control custom-checkbox">
                                                        <input type="checkbox"
                                                            class="custom-control-input checkbox" 
                                                            th:id="'checkBox_' + ${categoria.idCategoria}">
                                                        <label class="custom-control-label" 
                                                               th:for="'checkBox_' + ${categoria.idCategoria}"></label>
                                                    </div>
                                                </div>
                                            </td>
                                            <td><a href="javascript:void(0);" class="fw-bold" th:text="'#' + ${categoria.idCategoria}"></a></td>
                                            <td th:text="${categoria.nombre}"></td>
                                            <td>-</td>
                                            <td>
                                                <div class="badge bg-soft-success text-success" 
                                                     th:text="${categoria.estado ? 'Activo' : 'Inactivo'}">
                                                </div>
                                            </td>
                                            <td>
                                                <div class="hstack gap-2 justify-content-end">
                                                    <a th:href="@{/categorias-equipo/editar-categoria/{id}(id=${categoria.idCategoria})}"
                                                        class="avatar-text avatar-md"> <i
                                                        class="feather feather-edit"></i>
                                                    </a>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
