<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla/plantillaui}">

<head>
<meta charset="utf-8">
<title>Equipos</title>
</head>

<body>
	<div layout:fragment="contenidopaginas">
		<div class="page-header">
			<div class="page-header-left d-flex align-items-center">
				<div class="page-header-title">
					<h5 class="m-b-10">Equipos</h5>
				</div>
				<ul class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/equipos}">Home</a></li>
					<li class="breadcrumb-item">Crear</li>
				</ul>
			</div>
			<div class="page-header-right ms-auto">
				<div class="page-header-right-items">
					<div class="d-flex align-items-center gap-2 page-header-right-items-wrapper">
						<a href="javascript:void(0);" class="btn btn-primary successAlertMessage">
							<i class="feather-save me-2"></i> <span>Guardar</span>
						</a>
					</div>
				</div>
				<div class="d-md-none d-flex align-items-center">
					<a href="javascript:void(0)" class="page-header-right-open-toggle">
						<i class="feather-align-right fs-20"></i>
					</a>
				</div>
			</div>
		</div>

		<div class="main-content">
			<div class="card stretch stretch-full">
				<div class="card-body">

					<div class="row">
						<div class="col-lg-6 mb-4">
							<label class="form-label">Código SAP <span class="text-danger">*</span></label>
							<input type="text" class="form-control" placeholder="EQ-001">
						</div>

						<div class="col-lg-6 mb-4">
							<label class="form-label">Tipo Equipo <span class="text-danger">*</span></label>
							<input type="text" class="form-control" placeholder="Laptop / Desktop / Impresora">
						</div>

						<div class="col-lg-6 mb-4">
							<label class="form-label">Modelo <span class="text-danger">*</span></label>
							<input type="text" class="form-control" placeholder="Latitude 5420">
						</div>

						<div class="col-lg-6 mb-4">
							<label class="form-label">Serial <span class="text-danger">*</span></label>
							<input type="text" class="form-control" placeholder="SN-ABC-123">
						</div>

						<div class="col-lg-6 mb-4">
							<label class="form-label">Procesador</label>
							<input type="text" class="form-control" placeholder="Intel i7 / Ryzen 5">
						</div>

						<div class="col-lg-3 mb-4">
							<label class="form-label">Memoria RAM (GB)</label>
							<input type="number" class="form-control" placeholder="16">
						</div>

						<div class="col-lg-3 mb-4">
							<label class="form-label">Almacenamiento (GB)</label>
							<input type="number" class="form-control" placeholder="512">
						</div>

						<div class="col-lg-6 mb-4">
							<label class="form-label">Sistema Operativo</label>
							<input type="text" class="form-control" placeholder="Windows 11 Pro">
						</div>

						<div class="col-lg-3 mb-4">
							<label class="form-label">IP</label>
							<input type="text" class="form-control" placeholder="192.168.1.10">
						</div>

						<div class="col-lg-3 mb-4">
							<label class="form-label">MAC</label>
							<input type="text" class="form-control" placeholder="00-1A-2B-3C-4D-5E">
						</div>

						<div class="col-lg-4 mb-4">
							<label class="form-label">Fecha Compra</label>
							<input type="date" class="form-control">
						</div>

						<div class="col-lg-4 mb-4">
							<label class="form-label">Precio Compra</label>
							<input type="number" step="0.01" class="form-control" placeholder="1200.50">
						</div>

						<div class="col-lg-4 mb-4">
							<label class="form-label">Estado Equipo</label>
							<input type="text" class="form-control" placeholder="Operativo / En reparación">
						</div>

						<div class="col-lg-12 mb-4">
							<label class="form-label">Observación</label>
							<input type="text" class="form-control" placeholder="Observaciones del equipo">
						</div>

						<div class="col-lg-6 mb-4">
							<label class="form-label">Departamento</label>
							<select class="form-control" data-select2-selector="status">
								<option value="1" data-bg="bg-teal">Sistemas</option>
								<option value="2" data-bg="bg-secondary">Contabilidad</option>
								<option value="3" data-bg="bg-primary">Bodega</option>
							</select>
						</div>

						<div class="col-lg-6 mb-4">
							<label class="form-label">Marca</label>
							<select class="form-control" data-select2-selector="status">
								<option value="1" data-bg="bg-teal">Dell</option>
								<option value="2" data-bg="bg-secondary">HP</option>
								<option value="3" data-bg="bg-primary">Lenovo</option>
							</select>
						</div>

						<div class="col-lg-6 mb-4">
							<label class="form-label">Categoría</label>
							<select class="form-control" data-select2-selector="status">
								<option value="1" data-bg="bg-teal">Laptops</option>
								<option value="2" data-bg="bg-secondary">Desktops</option>
								<option value="3" data-bg="bg-primary">Impresoras</option>
							</select>
						</div>

						<div class="col-lg-6 mb-4">
							<label class="form-label">Proveedor</label>
							<select class="form-control" data-select2-selector="status">
								<option value="1" data-bg="bg-teal">Proveedor X</option>
								<option value="2" data-bg="bg-secondary">Proveedor Y</option>
							</select>
						</div>

						<div class="col-lg-4 mb-4">
							<div class="form-check form-switch form-switch-sm ps-5">
								<input class="form-check-input c-pointer" type="checkbox" id="licenciaWindows">
								<label class="form-check-label fw-500 text-dark c-pointer" for="licenciaWindows">Licencia Windows Activada</label>
							</div>
						</div>

						<div class="col-lg-4 mb-4">
							<div class="form-check form-switch form-switch-sm ps-5">
								<input class="form-check-input c-pointer" type="checkbox" id="activoFijo">
								<label class="form-check-label fw-500 text-dark c-pointer" for="activoFijo">Etiqueta Activo Fijo</label>
							</div>
						</div>

						<div class="col-lg-4 mb-4">
							<div class="form-check form-switch form-switch-sm ps-5">
								<input class="form-check-input c-pointer" type="checkbox" id="unionDominio">
								<label class="form-check-label fw-500 text-dark c-pointer" for="unionDominio">Unión a Dominio</label>
							</div>
						</div>

						<div class="col-lg-6 mb-4">
							<label class="form-label">Tipo Licencia Office</label>
							<input type="text" class="form-control" placeholder="Microsoft 365 / Office 2019">
						</div>

						<div class="col-lg-6 mb-4">
							<label class="form-label">Versión Office</label>
							<input type="text" class="form-control" placeholder="2019 / 2021">
						</div>

						<div class="row mb-4">
							<div class="form-check form-switch form-switch-sm ps-5">
								<input class="form-check-input c-pointer" type="checkbox" id="estado">
								<label class="form-check-label fw-500 text-dark c-pointer" for="estado">Activo</label>
							</div>
						</div>

					</div>

				</div>
			</div>
		</div>
	</div>

</body>

</html>
