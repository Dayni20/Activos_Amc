<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla/plantillaui}">

<head>
<title>Equipos</title>
</head>

<body>
	<div layout:fragment="contenidopaginas">

		<div class="page-header">
			<div class="page-header-left d-flex align-items-center">
				<div class="page-header-title">
					<h5 class="m-b-10">Equipos</h5>
				</div>
				<ul class="breadcrumb">
					<li class="breadcrumb-item"><a th:href="@{/equipos}">Home</a>
					</li>
					<li class="breadcrumb-item">Equipos</li>
				</ul>
			</div>

			<div class="page-header-right ms-auto">
				<div class="page-header-right-items">
					<div
						class="d-flex align-items-center gap-2 page-header-right-items-wrapper">

						<a th:href="@{/equipos/nuevo-equipo}" class="btn btn-primary">
							<i class="feather-plus me-2"></i> <span>Nuevo Equipo</span>
						</a>

					</div>
				</div>
			</div>
		</div>

		<div class="main-content">
			<div class="row">
				<div class="col-lg-12">
					<div class="card stretch stretch-full">
						<div class="card-body p-0">
							<div class="table-responsive">

								<table class="table table-hover">
									<thead>
										<tr>
											<th>Código SAP</th>
											<th>Tipo</th>
											<th>Modelo</th>
											<th>Serial</th>
											<th>Procesador</th>
											<th>RAM (GB)</th>
											<th>Almacenamiento (GB)</th>
											<th>S.O.</th>
											<th>Departamento</th>
											<th>Marca</th>
											<th>Categoría</th>
											<th>Proveedor</th>
											<th>Estado</th>
											<th class="text-end">Acciones</th>
										</tr>
									</thead>

									<tbody>
										<tr class="single-item">
											<td>EQ-001</td>
											<td>Laptop</td>
											<td>Latitude 5420</td>
											<td>SN-ABC-123</td>
											<td>Intel i7</td>
											<td>16</td>
											<td>512</td>
											<td>Windows 11 Pro</td>
											<td>Sistemas</td>
											<td>Dell</td>
											<td>Laptops</td>
											<td>Proveedor X</td>
											<td><span class="badge bg-soft-success text-success">Activo</span>
											</td>
											<td class="text-end">
												<div class="hstack gap-2 justify-content-end">
													<a href="#" class="avatar-text avatar-md"> <i
														class="feather feather-edit"></i>
													</a>
												</div>
											</td>
										</tr>
									</tbody>


								</table>

							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

	</div>
</body>
</html>
