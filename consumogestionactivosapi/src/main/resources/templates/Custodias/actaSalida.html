<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{plantilla/plantillaui}">

<head>
    <title>Acta de Salida</title>
</head>

<body>
<div layout:fragment="contenidopaginas">

    <div class="page-header">
        <div class="page-header-left d-flex align-items-center">
            <div class="page-header-title">
                <h5 class="m-b-10">Acta de Salida</h5>
            </div>
        </div>

        <div class="page-header-right ms-auto d-flex gap-2">
            <a th:href="@{/custodias/acta-salida/pdf}" class="btn btn-primary">
                DESCARGAR PDF
            </a>
            <a th:href="@{/custodias}" class="btn btn-secondary">
                VOLVER
            </a>
        </div>
    </div>

    <div class="card">
        <div class="card-body">

            <p><b>ID Custodio:</b> <span th:text="${idCustodioReal != null ? idCustodioReal : 0}"></span></p>
            <p><b>Custodio:</b> <span th:text="${nombreCustodioReal}"></span></p>
            <p><b>Fecha salida:</b> <span th:text="${fechaSalidaReal}"></span></p>
            <p><b>Observación:</b> <span th:text="${observacionReal}"></span></p>

            <hr/>

            <h6 class="mb-3"><b>Equipos devueltos</b></h6>

            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Código</th>
                        <th>Tipo</th>
                        <th>Modelo</th>
                        <th>Serial</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="d : ${detalles}">
                        <td th:text="${d.fkEquipo != null ? d.fkEquipo.idEquipo : ''}"></td>
                        <td th:text="${d.fkEquipo != null ? d.fkEquipo.codigoSap : ''}"></td>
                        <td th:text="${d.fkEquipo != null ? d.fkEquipo.tipoEquipo : ''}"></td>
                        <td th:text="${d.fkEquipo != null ? d.fkEquipo.modelo : ''}"></td>
                        <td th:text="${d.fkEquipo != null ? d.fkEquipo.serial : ''}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>
</body>
</html>
