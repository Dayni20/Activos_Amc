<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{plantilla/plantillaui}">
<head>
<title>Nueva Custodia</title>
</head>

<body>
	<div layout:fragment="contenidopaginas">

		<div class="page-header">
			<div class="page-header-title">
				<h5 class="m-b-10">Nueva Custodia</h5>
			</div>
		</div>

		<div class="card">
			<div class="card-body">

				<form th:action="@{/custodias}" th:object="${custodia}"
					method="post">

					<input type="hidden" th:field="*{idCustodiaEquipo}" /> <input
						type="hidden" th:field="*{estado}" />

					<div class="row">

						<div class="col-md-4 mb-3">
							<label class="form-label">Fecha Inicio</label> <input type="date"
								class="form-control" th:field="*{fechaInicio}"> <small
								class="text-danger" th:if="${errorFechaInicio}"
								th:text="${errorFechaInicio}"></small>
						</div>

						<div class="col-md-4 mb-3">
							<label class="form-label">Fecha Fin</label> <input type="date"
								class="form-control" th:field="*{fechaFin}">
						</div>

						<div class="col-md-4 mb-3">
							<label class="form-label">Observación</label> <input type="text"
								class="form-control" th:field="*{observacion}"
								placeholder="Ej: Asignación inicial"> <small
								class="text-danger" th:if="${errorObservacion}"
								th:text="${errorObservacion}"></small>
						</div>

						<div class="col-md-6 mb-3">
							<label class="form-label">Equipo</label> <select
								class="form-select" th:field="*{fkEquipo.idEquipo}">
								<option value="0">-- Seleccione --</option>
								<option th:each="e : ${listaEquipos}" th:value="${e.idEquipo}"
									th:text="${e.codigoSap + ' - ' + e.tipoEquipo}"></option>
							</select> <small class="text-danger" th:if="${errorEquipo}"
								th:text="${errorEquipo}"></small>
						</div>

						<div class="col-md-6 mb-3">
							<label class="form-label">Custodio</label> <select
								class="form-select" th:field="*{fkCustodio.idCustodio}">
								<option value="0">-- Seleccione --</option>
								<option th:each="c : ${listaCustodios}"
									th:value="${c.idCustodio}"
									th:text="${c.nombres + ' ' + c.apellidos}"></option>
							</select> <small class="text-danger" th:if="${errorCustodio}"
								th:text="${errorCustodio}"></small>
						</div>

					</div>

					<div class="d-flex gap-2">
						<button type="submit" class="btn btn-primary">Guardar</button>
						<a th:href="@{/custodias}" class="btn btn-secondary">Cancelar</a>
					</div>

				</form>

			</div>
		</div>

	</div>
</body>
</html>
