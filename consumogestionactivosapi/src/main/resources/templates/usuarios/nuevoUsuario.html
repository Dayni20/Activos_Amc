<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{plantilla/plantillaui}">

<head>
<meta charset="utf-8">
<title>Usuarios</title>
</head>

<body>
    <div layout:fragment="contenidopaginas">
        <div class="page-header">
            <div class="page-header-left d-flex align-items-center">
                <div class="page-header-title">
                    <h5 class="m-b-10">Usuarios</h5>
                </div>
                <ul class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/usuarios}">Home</a></li>
                    <li class="breadcrumb-item">Crear</li>
                </ul>
            </div>
            <div class="page-header-right ms-auto">
                <div class="page-header-right-items">
                    <div
                        class="d-flex align-items-center gap-2 page-header-right-items-wrapper">
                        <a href="javascript:void(0);"
                            class="btn btn-primary successAlertMessage"> <i
                            class="feather-save me-2"></i> <span>Guardar</span>
                        </a>
                    </div>
                </div>
                <div class="d-md-none d-flex align-items-center">
                    <a href="javascript:void(0)" class="page-header-right-open-toggle">
                        <i class="feather-align-right fs-20"></i>
                    </a>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="card stretch stretch-full">
                <div class="card-body">
                    <div class="mb-4">
                        <label class="form-label">Nombre <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" placeholder="Nombre completo">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" placeholder="usuario@dominio.com">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Rol </label> <select
                            class="form-control" data-select2-selector="rol">
                            <option>ADMIN</option>
                            <option>USER</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Departamento </label> <select
                            class="form-control" data-select2-selector="departamento">
                            <option>Sistemas</option>
                            <option>Recursos Humanos</option>
                        </select>
                    </div>
                    <div class="row mb-4">
                        <div class="form-check form-switch form-switch-sm ps-5">
                            <input class="form-check-input c-pointer" type="checkbox"
                                id="estadoSwitch"> <label
                                class="form-check-label fw-500 text-dark c-pointer"
                                for="estadoSwitch">Activo</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
